name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: compliance-simulation-platform
          environment-file: environment.yml
          miniforge-version: latest
      - run: python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            game-poc/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm ci && npm run build
        working-directory: game-poc

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t compliance-platform:test .
      - name: Start packaged application with project fixtures
        run: |
          docker run -d --name compliance-platform-test -p 8000:8000 \
            -v "${{ github.workspace }}/backend/tests/fixtures/project_docs:/project-docs:ro" \
            -e PROJECT_DOCS_ROOT=/project-docs \
            compliance-platform:test
      - name: Smoke test packaged application
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              curl --fail --silent --output /dev/null http://127.0.0.1:8000/
              exit 0
            fi
            sleep 1
          done
          docker logs compliance-platform-test
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run project onboarding browser E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          E2E_EXPECTED_DOCS: 5
          E2E_EXPECTED_UNSUPPORTED: 1
        run: npm run test:e2e
      - name: Clean up test container
        if: always()
        run: docker rm --force compliance-platform-test || true
